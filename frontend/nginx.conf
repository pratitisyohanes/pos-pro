# Docker only: "api" is the pos-api container, booking-api runs on the host
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:5001;
  }

  location /auth/ {
    proxy_pass http://host.docker.internal:5000/api/v1/auth/;
  }

  # Hashed build assets never change, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Send every unknown path to the SPA so React Router can handle it
  location / {
    try_files $uri $uri/ /index.html;
  }
}
