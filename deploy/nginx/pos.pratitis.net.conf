# Nginx site for the POS app: React files from disk, /api to pos-api (5001), /auth to booking-api (5000)
# Install: sudo cp pos.pratitis.net.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/pos.pratitis.net.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name pos.pratitis.net;

    root /var/www/pos/frontend/dist;
    index index.html;

    client_max_body_size 2m;

    # booking-api internal routes must never be reachable from the internet
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login, refresh and profile are served by booking-api, so one account works in both apps
    location /auth/ {
        proxy_pass http://127.0.0.1:5000/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers may cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path belongs to React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
